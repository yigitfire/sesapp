<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Monke</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  /* Noto Sans (SIL OFL, vendor/noto-sans-LICENSE.txt). Uygulamanın içinde; internetten indirilmez.
     İkinci dosya sadece latin dışı Türkçe harfleri (ğ Ğ ş Ş İ) içerir. */
  @font-face{font-family:'Noto Sans';font-weight:100 900;font-display:block;src:url(vendor/noto-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Noto Sans';font-weight:100 900;font-display:block;src:url(vendor/noto-sans-tr.woff2) format('woff2');
    unicode-range:U+011E-011F,U+0130,U+015E-015F}

  /* Renkler logoyla uyumlu: nötr koyu zemin (#111111) + lime vurgu (#C6F432).
     --lime: düğme zemini (iki temada da), üstündeki yazı koyu.
     --vurgu: halka, seviye çubuğu, anahtar gibi ince vurgular; --vurguUst: vurgu üstündeki renk. */
  :root{--bg:#111111;--bg2:#171717;--bg3:#1f1f1f;--bg4:#2a2a2a;--alt:#141414;
        --yazi:#dcdcdc;--soluk:#808080;--lime:#c6f432;--vurgu:#c6f432;--vurguUst:#111111;
        --kirmizi:#ed5555;--bas:#fff;color-scheme:dark}
  /* Açık tema (Ayarlar'dan). Sadece renk değişkenleri değişir. */
  /* Açık zeminde lime ince çizgi okunmaz; ince vurgular koyu zeytin yeşili. */
  :root[data-tema=acik]{--bg:#f6f6f6;--bg2:#ececec;--bg3:#e2e2e2;--bg4:#d2d2d2;--alt:#e6e6e6;
        --yazi:#1a1a1a;--soluk:#6b6b6b;--vurgu:#5f7f00;--vurguUst:#fff;--kirmizi:#d93b3b;--bas:#1a1a1a;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--yazi);
       font:15px/1.4 'Noto Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  input{font:inherit;color:inherit;background:var(--bg3);border:1px solid transparent;border-radius:8px;padding:10px 12px;outline:none;min-width:0}
  input:focus{border-color:#34363b}
  ::placeholder{color:var(--soluk)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* Simge çizimlerinin durduğu kutu. Gizleme burada yapılır, HTML'deki style="" ile değil:
     Tauri, Windows'ta satır içi stilleri güvenlik politikası (CSP) yüzünden engelliyor; o zaman
     kutu gizlenmiyor ve varsayılan 300x150 boyutuyla soldan 300 px yer kaplıyordu. */
  #simgeler{display:none}
  /* Simgeler: aşağıdaki <symbol>'lerden çizilir, rengi yazı renginden alır. */
  .i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .ib{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--soluk)}
  .ib:hover{background:var(--bg4);color:var(--yazi)}
  .ib.kapali,.ib.kapali:hover{color:var(--kirmizi)}
  .ib.tehlike:hover{color:var(--kirmizi)}
  .ib.k{width:26px;height:26px}
  .ib.k .i{width:16px;height:16px}

  /* Giriş */
  #giris{margin:auto;width:280px;display:flex;flex-direction:column;gap:10px}
  #logo{display:grid;place-items:center;margin-bottom:14px}
  #logo img{width:72px;height:72px;display:block}
  .satir{display:flex;gap:8px}
  .satir input{flex:1}
  #katil{width:42px;border-radius:8px;display:grid;place-items:center;background:var(--lime);color:#111111}
  #katil:hover{filter:brightness(1.15)}
  #katil:disabled{opacity:.4;cursor:default}
  #hata{min-height:20px;font-size:13px;text-align:center;color:var(--soluk)}
  #hata.hata{color:var(--kirmizi)}

  #app{display:none;flex:1;min-width:0}

  /* Sol: kişiler + alttaki kendi panelim */
  #sol{width:240px;flex:none;display:flex;flex-direction:column;background:var(--bg2)}
  #kisiler{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
  .kisi{padding:6px 8px;border-radius:8px}
  .kisi:hover{background:var(--bg3)}
  .ust{display:flex;align-items:center;gap:10px}
  .av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:14px;font-weight:600;color:#111;transition:box-shadow .1s;background-size:cover;background-position:center}
  /* Konuşanın halkası: 3 px yeşil, fotoğrafla arasında arka plan renginde 2 px boşluk
     (fotoğrafın üstünde de net seçilsin). Boşluğun rengi bulunduğu satırın rengidir. */
  .konusuyor .av{box-shadow:0 0 0 2px var(--halkaArka,var(--bg2)),0 0 0 5px var(--vurgu)}
  .kisi:hover{--halkaArka:var(--bg3)}
  #ben{--halkaArka:var(--alt)}
  .ad{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ses{display:none;align-items:center;gap:8px;margin-top:6px;padding-left:2px}
  /* Arkadaşın kaydırıcısı üstüne gelince açılır. */
  .kisi:hover .ses{display:flex}
  .yuzde{width:30px;text-align:right;font-size:12px;color:var(--soluk);font-variant-numeric:tabular-nums}
  .sus{opacity:0}
  .kisi:hover .sus,.susturuldu .sus{opacity:1}
  .susturuldu .ad{opacity:.5}
  .susturuldu .sus{color:var(--kirmizi)}
  /* Sol taraf ses kanalıdır: sadece seste olanlar görünür. Sadece sohbette olanlar
     (ve çevrimdışılar) sağdaki üye listesinde. */
  .kisi.yazida{display:none}
  /* Ses odası satırı (Discord'daki ses kanalı gibi): tıklayınca sese girilir. Altında,
     içeride olanlar girintili listelenir; sese girmeden de uzaktan görünür. */
  #odaSatiri{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;
             font-size:14px;font-weight:600;color:var(--soluk);text-align:left}
  #odaSatiri:hover{background:var(--bg3);color:var(--yazi)}
  #odaSatiri .i{width:18px;height:18px}
  #odaSatiri .katil{margin-left:auto;font-size:12px;font-weight:600;color:var(--vurgu);opacity:0}
  #odaSatiri:hover .katil{opacity:1}
  /* Sestesin: oda vurgulu, tıklanmaz. */
  #app:not(.sessiz) #odaSatiri{color:var(--vurgu);cursor:default;background:none}
  #app:not(.sessiz) #odaSatiri .katil{display:none}
  #kisiler .kisi,#benOdada{margin-left:22px;padding:4px 8px}
  #kisiler .av,#benOdada .av{width:26px;height:26px;font-size:12px}
  #benOdada{display:none}
  #app:not(.sessiz) #benOdada{display:block}

  /* Seste değilken: "Ses bağlı" şeridi, mikrofon/kulaklık düğmeleri ve menüleri gizlenir. */
  .sessiz #sesBagli,.sessiz #ben .grup,.sessiz #ben .menu{display:none}
  #mikHata{padding:0 12px 8px;font-size:12px;text-align:center;color:var(--kirmizi)}
  .ib.bekliyor{opacity:.5}
  #mikHata:empty{display:none}

  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;padding:0;border:0;border-radius:2px;cursor:pointer;
    background:linear-gradient(var(--yazi),var(--yazi)) 0/var(--p,50%) 100% no-repeat,var(--bg4)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--bas)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--bas)}
  input[type=range]::-moz-range-track{background:transparent}

  #ben{position:relative;padding:8px;background:var(--alt)}
  #benAv{cursor:pointer}
  #benIsim{flex:1;padding:4px 6px;margin-left:-4px;border-radius:6px;font-weight:600;background:transparent}
  #benIsim:hover,#benIsim:focus{background:var(--bg3);border-color:transparent}
  .bar{height:3px;margin-top:8px;border-radius:2px;background:var(--bg4);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--vurgu)}
  #renkler{display:none;position:absolute;left:8px;right:8px;bottom:100%;margin-bottom:6px;padding:12px;border-radius:10px;
           background:var(--bg3);box-shadow:0 8px 24px #0008;grid-template-columns:repeat(6,1fr);gap:10px}
  #renkler.acik{display:grid}
  #renkler button{aspect-ratio:1;border-radius:50%;outline:2px solid transparent;outline-offset:2px}
  #renkler button.secili{outline-color:var(--yazi)}
  #ben .ust{gap:4px}
  #ben .ib{width:28px}
  /* Mikrofon ve kulaklık: Discord'daki gibi düğme + yanında menü oku tek parça.
     Kapalıyken parçanın zemini kırmızımsı, simge kırmızı. */
  #ben .grup{display:flex;align-items:center;flex:none;border-radius:6px}
  #ben .grup .ib{border-radius:6px 0 0 6px}
  #ben .grup .ok{width:14px;height:32px;display:grid;place-items:center;border-radius:0 6px 6px 0;color:var(--soluk)}
  #ben .grup .ok .i{width:12px;height:12px}
  #ben .grup .ok:hover,#ben .grup .ok.acik{background:var(--bg4);color:var(--yazi)}
  #ben .grup.kapali{background:color-mix(in srgb,var(--kirmizi) 16%,transparent)}
  #ben .grup.kapali .ib,#ben .grup.kapali .ok{color:var(--kirmizi)}
  /* Sesteyken kendi satırımın üstündeki şerit: bağlı olduğu oda ve sesten çık düğmesi. */
  #sesBagli{display:flex;align-items:center;gap:6px;padding:2px 0 8px 4px;margin-bottom:8px;border-bottom:1px solid var(--bg4)}
  #sesBagli .yazi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #sesBagli b{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--vurgu)}
  #sesBagli b .i{width:15px;height:15px}
  #sesBagli span{font-size:12px;color:var(--soluk)}
  #sesBagli .ib{width:32px}
  /* Mikrofon/kulaklık okunun açtığı küçük menü: panelin hemen üstünde açılır. */
  #ben .menu{display:none;position:absolute;left:8px;right:8px;bottom:100%;z-index:4;margin-bottom:6px;padding:12px;border-radius:10px;
             background:var(--bg3);box-shadow:0 8px 24px #0008}
  #ben .menu.acik{display:block}
  #ben .menu h4{margin:0 0 10px;font-size:13px;font-weight:600}
  #ben .menu .seviye{display:flex;align-items:center;gap:8px}
  #ben .menu .ayrac{height:1px;margin:10px 0 12px;background:var(--bg4)}
  /* Giriş cihazı: tıklayınca altında mikrofon listesi açılır; seçili olan lime. */
  .secim{display:flex;align-items:center;gap:8px;width:calc(100% + 16px);margin:-6px -8px 0;padding:6px 8px;border-radius:6px;text-align:left}
  .secim:hover{background:var(--bg4)}
  .secim span{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .secim b{font-size:13px;font-weight:600}
  .secim small{font-size:12px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .secim .i{width:16px;height:16px;color:var(--soluk);transition:transform .15s}
  .secim.acik .i{transform:rotate(90deg)}
  #girisCihazlari{display:none;flex-direction:column;gap:1px;max-height:180px;overflow:auto;margin:6px -8px 0}
  #girisCihazlari.acik{display:flex}
  #girisCihazlari button{padding:6px 8px;border-radius:6px;text-align:left;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #girisCihazlari button:hover{background:var(--bg4)}
  #girisCihazlari button.secili{color:var(--vurgu);font-weight:600}
  #girisCihazlari small{color:var(--soluk);font-weight:400}

  /* En sağ: üye listesi. Çevrimiçiler canlı, çevrimdışılar sönük ve "ne zaman" yazılı. */
  #uyeler{width:220px;flex:none;overflow:auto;padding:12px 8px;background:var(--bg2)}
  .uyeBaslik{padding:10px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk)}
  .uye{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px}
  .uye:hover{background:var(--bg3);--halkaArka:var(--bg3)}
  .uyeYazi{flex:1;min-width:0;display:flex;flex-direction:column}
  .uye .ad{font-size:14px}
  .uye .zaman{font-size:11px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uye.cevrimdisi{opacity:.4}
  .uye.cevrimdisi .ad{color:var(--yazi)!important}
  /* Pencere daralınca sohbete yer kalsın diye üye listesi gizlenir. */
  @media (max-width:760px){#uyeler,#sagTutamak{display:none}}

  /* Sütunlar arasındaki çekme tutamağı: kenardan çekip sol/sağ sütunu genişlet-daralt.
     Yer kaplamaz (eksi kenar boşluğu), üstüne gelince ince bir çizgi görünür. */
  .tutamak{flex:none;width:6px;margin:0 -3px;position:relative;z-index:2;cursor:col-resize}
  .tutamak::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:var(--vurgu);opacity:0;transition:opacity .15s}
  .tutamak:hover::after,.tutamak.surukleniyor::after{opacity:.6}
  body.surukleniyor{cursor:col-resize;user-select:none;-webkit-user-select:none}

  /* Sağ: sohbet */
  #sag{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

  /* GIF paneli (Klipy). Sonuçlar Klipy'nin verdiği sırayla, soldan sağa ızgarada. */
  #gifPanel{display:none;position:absolute;right:16px;bottom:72px;z-index:3;width:min(420px,calc(100% - 32px));height:380px;
            flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--bg2);box-shadow:0 12px 32px #0007}
  #gifPanel.acik{display:flex}
  #gifAra{width:100%}
  #gifIzgara{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
  #gifIzgara button{height:110px;padding:0;border-radius:6px;overflow:hidden;background:var(--bg3)}
  #gifIzgara img{width:100%;height:100%;object-fit:cover;display:block}
  #gifIzgara button:hover{outline:2px solid var(--yazi)}
  #gifDurum{grid-column:1/-1;padding:20px 0;text-align:center;font-size:13px;color:var(--soluk)}
  #gifDurum:empty{display:none}
  #gifPanel .klipy{font-size:11px;text-align:right;color:var(--soluk)}
  .gifBaslik{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--soluk);margin:2px 2px 0}

  /* Emoji paneli: kategoriler alt alta, tıklanan emoji yazının imleç olduğu yerine girer. */
  #emojiPanel{display:none;position:absolute;right:16px;bottom:72px;z-index:3;width:min(360px,calc(100% - 32px));height:340px;
              padding:6px 4px 6px 8px;border-radius:12px;background:var(--bg2);box-shadow:0 12px 32px #0007}
  #emojiPanel.acik{display:flex}
  #emojiIzgara{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(8,1fr);align-content:start}
  #emojiIzgara h4{grid-column:1/-1;margin:8px 4px 4px;font-size:11px;font-weight:600;color:var(--soluk)}
  #emojiIzgara button{font-size:24px;line-height:1;padding:5px 0;border-radius:6px;
                      font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  #emojiIzgara button:hover{background:var(--bg4)}
  .msj img.gif{display:block;max-width:100%;height:auto;margin:4px 0 2px;border-radius:8px;background:var(--bg3)}
  /* Gri zemin sadece yüklenirken yer tutar; yüklenince kalkar (şeffaf GIF'ler kutu içinde görünmesin). */
  .msj img.gif.yuklendi{background:none}
  /* Sohbette gönderilen fotoğraf: küçük görünür, tıklayınca büyür. Gelene kadar gri kutu. */
  .msj img.resim{display:block;max-width:100%;height:auto;margin:4px 0 2px;border-radius:8px;background:var(--bg3);cursor:zoom-in}
  .msj img.resim.yuklendi{background:none}
  #buyukFoto.resimModu img{width:auto;height:auto;max-width:92vw;max-height:84vh;aspect-ratio:auto;border-radius:8px}
  /* Dosya sohbetin üstüne sürüklenince çıkan çerçeve. */
  #surukle{display:none;position:absolute;inset:8px;z-index:4;border:2px dashed var(--vurgu);border-radius:12px;
           background:color-mix(in srgb,var(--bg) 85%,transparent);align-items:center;justify-content:center;
           font-weight:600;color:var(--vurgu);pointer-events:none}
  #surukle.acik{display:flex}
  #sohbetUyari{margin:0 16px 6px;font-size:12px;color:var(--kirmizi)}
  #sohbetUyari:empty{display:none}
  #yaz #resimAc{margin-left:4px}
  #mesajlar{flex:1;overflow:auto;padding:16px 20px 8px;user-select:text;-webkit-user-select:text}
  /* Mesajlar: grubun ilk mesajında solda kişinin yuvarlağı, devamı aynı hizada. */
  .msj{position:relative;padding:1px 0 1px 46px;overflow-wrap:anywhere}
  .msj .av{position:absolute;left:0;top:3px;width:34px;height:34px}
  .msj.bas{margin-top:14px;min-height:38px}
  .msj.bas:first-child{margin-top:0}
  .msj .kim{display:flex;align-items:baseline;gap:8px}
  .msj .kim b{font-weight:600}
  .msj time{font-size:11px;color:var(--soluk)}
  /* Mesajdaki emojiler yazıdan biraz büyük; sadece emojiden oluşan mesajda (Discord'daki gibi) iri. */
  .msj .emoji{font-size:1.4em;line-height:1;vertical-align:-.12em;margin:0 1px;
              font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  .msj .sadeceEmoji{line-height:1.25}
  .msj .sadeceEmoji .emoji{font-size:2.6em}
  #yaz{display:flex;align-items:center;margin:0 16px 16px;padding-right:4px;border-radius:10px;background:var(--bg3)}
  #yaz input{flex:1;padding:12px 14px;background:transparent;border:0}
  #sesUyari{display:none;margin:12px 16px 0;padding:8px 12px;border-radius:8px;background:#2a2410;color:#f5d047;font-size:13px;cursor:pointer}
  :root[data-tema=acik] #sesUyari{background:#fbefc6;color:#6e5300}
  #guncelleme{display:none;position:fixed;top:0;left:0;right:0;z-index:9;padding:6px;text-align:center;font-size:13px;background:var(--bg4)}

  /* Ayarlar penceresi */
  /* Büyük profil fotoğrafı: fotoğraflı birinin yuvarlağına tıklayınca açılır. */
  #buyukFoto{display:none;position:fixed;inset:0;z-index:6;background:#000b;flex-direction:column;gap:12px;align-items:center;justify-content:center;cursor:zoom-out}
  #buyukFoto.acik{display:flex}
  #buyukFoto img{width:min(256px,80vw);height:auto;aspect-ratio:1;border-radius:16px;box-shadow:0 12px 40px #0008;image-rendering:auto}
  #buyukFoto div{font-size:15px;font-weight:600;color:#fff}
  #kisiler .av.fotolu,#mesajlar .av.fotolu,#uyeler .av.fotolu{cursor:zoom-in}
  #ayarlar{display:none;position:fixed;inset:0;z-index:5;background:#0009;align-items:center;justify-content:center}
  #ayarlar.acik{display:flex}
  #ayarlar .kart{width:300px;max-width:calc(100vw - 32px);padding:16px;border-radius:12px;background:var(--bg2);box-shadow:0 12px 40px #0006}
  #ayarlar .ust{justify-content:space-between;margin-bottom:6px}
  #ayarlar h2{margin:0;font-size:16px;font-weight:600}
  #ayarlar h3{margin:16px 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk)}
  .bolmeli{display:flex;padding:3px;border-radius:8px;background:var(--bg3)}
  .bolmeli button{flex:1;padding:6px;border-radius:6px;font-size:14px;color:var(--soluk)}
  .bolmeli button.secili{background:var(--bg)!important;color:var(--yazi)}
  .anahtar{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:14px;cursor:pointer}
  .anahtar input{-webkit-appearance:none;appearance:none;width:34px;height:20px;padding:0;margin:0;border:0;border-radius:10px;
                 background:var(--bg4);position:relative;cursor:pointer;transition:background .15s}
  .anahtar input::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
  .anahtar input:checked{background:var(--vurgu)}
  .anahtar input:checked::after{background:var(--vurguUst)}
  .anahtar input:checked::after{transform:translateX(14px)}

<script type="module">
import {joinRoom} from './vendor/trystero-0.27.0.js'

const $ = id => document.getElementById(id)
// Masaüstü uygulamasında (Tauri) mikrofon tarayıcı motoru yerine Rust'tan gelir.
const masaustu = !!window.__TAURI__

// Koyu arka planda okunaklı 12 renk.
const RENKLER = ['#5b8cff', '#4cc3ff', '#2ed3b7', '#3ccf6e', '#a3e05a', '#f5d047',
                 '#ff9f43', '#ff7a6b', '#ff5a6e', '#ff6fb5', '#9b6bff', '#c9a7ff']
const GECMIS_MAX = 1000

// Kalıcı kayıt (cihazda). Bozuk/erişilemeyen depoda uygulama yine çalışsın diye try içinde.
const oku = (k, v) => { try { return JSON.parse(localStorage.getItem(k)) ?? v } catch { return v } }
const kaydet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
// Bizim GIF'lerimiz: uygulamanın içinde gelir (web/gif/ klasörü). Mesajla sadece bu bilgi gider,
// herkes GIF'i kendi uygulamasındaki kopyadan gösterir; internetten indirilmez.
// Yeni GIF eklemek için dosyayı web/gif/'e koyup buraya bir satır eklemek yeter.
const MONKE_GIFLER = [
  {s: 'monke-coin', t: 'Monke', u: 'gif/monke-coin.gif', w: 400, h: 400},
]

// Hesap = Trystero'nun cihazda sakladığı kalıcı, şifreli userId. Mesajlar isme değil
// bu kimliğe bağlı; isim/renk değişince eski mesajlar da yeni isim/renkle görünür.
// profiller: userId -> {isim, renk, g}. g: sahibinin son değiştirdiği an (yenisi kazanır).
const profiller = oku('profiller', {})
// Kişi başı ses ayarı, sadece bu cihazda: userId -> {v: 0-200, s: susturuldu mu}.
// Kimliğe bağlı olduğu için kişi ismini değiştirse de ayar kalır.
const sesler = oku('sesler', {})
let gecmis = []          // [{id, u: userId, t: metin, z: zaman}]
let gecmisAnahtari = ''  // her odanın geçmişi ayrı saklanır
// Odanın üyeleri ve en son ne zaman çevrimiçi göründükleri: userId -> zaman (ms).
// Sunucu olmadığı için herkes kendi gördüğünü tutar; biri girince elindekini karşıya yollar,
// iki taraf her kişi için en yeni zamanı alır. Her odanınki ayrı saklanır.
let uyeler = {}, uyeAnahtari = ''

let ctx, room, profil, benimId = ''
const kisiler = new Map()
// Ses kanalı. Odaya girmek = sohbet; sese girmek ayrı. Seste değilken mikrofon tamamen
// kapalı (Mac'teki turuncu mikrofon ışığı da söner) ve kimse duyulmaz.
let sesteyim = false, sesDurumu, micGain, micKaynak, dinleme
let kapali = false   // kullanıcı mikrofonunu kendisi kapattı mı (mute)
let sagir = false    // kulaklığı kapattı mı: kimseyi duymaz, mikrofonu da kapanır (Discord'daki gibi)
// Giriş (mikrofon) ve çıkış (herkesin sesi) seviyeleri, % olarak; bu cihazda saklanır.
const seviyeOku = (k) => { const v = Number(oku(k, 100)); return Number.isFinite(v) ? Math.max(0, Math.min(200, Math.round(v))) : 100 }
let girisSeviyesi = seviyeOku('girisSeviye'), cikisSeviyesi = seviyeOku('cikisSeviye')
let acmaNo = 0       // sürmekte olan mikrofon açma denemesi; sesten çıkınca geçersiz sayılır
// Kim seste: userId -> true/false. Hiç bilgi gelmediyse (eski sürüm) seste sayılır,
// çünkü eski sürümler her zaman sestedir.
const seste = new Map()
const sesteMi = id => seste.get(id) !== false

const gecerliRenk = r => RENKLER.includes(r) ? r : null
// İlk renk kimlikten türetilir: herkes baştan farklı (büyük ihtimalle) bir renkle başlar.
const varsayilanRenk = id => {
  let h = 0
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0
  return RENKLER[h % RENKLER.length]
}
const isimAl = id => profiller[id]?.isim || 'Biri'
const renkAl = id => gecerliRenk(profiller[id]?.renk) || varsayilanRenk(id)
const basHarf = id => [...isimAl(id)][0].toLocaleUpperCase('tr-TR')

// Simge düğmesinin içini değiştirir (ör. mikrofon açık/kapalı).
const simge = (el, ad) => el.innerHTML = `<svg class="i"><use href="#i-${ad}"/></svg>`
// Kaydırıcının dolu kısmını boyar (CSS --p değişkeni).
const boya = r => r.style.setProperty('--p', r.value / r.max * 100 + '%')
const durum = (metin, hata = true) => { $('hata').textContent = metin; $('hata').classList.toggle('hata', hata) }

// ---- Ayarlar: tema + bildirim sesleri (bu cihazda saklanır) ----
const bildirim = {giris: true, cikis: true, mesaj: true, ...oku('bildirim', {})}
function temaUygula(t) {
  if (t === 'acik') document.documentElement.dataset.tema = 'acik'
  else delete document.documentElement.dataset.tema
  for (const b of $('temaSec').children) b.classList.toggle('secili', b.dataset.tema === t)
}
temaUygula(localStorage.getItem('tema') === 'acik' ? 'acik' : 'koyu')
$('temaSec').onclick = e => {
  const t = e.target.dataset?.tema
  if (!t) return
  try { localStorage.setItem('tema', t) } catch {}
  temaUygula(t)
}
for (const k of document.querySelectorAll('[data-bildirim]')) {
  k.checked = bildirim[k.dataset.bildirim]
  k.onchange = () => {
    bildirim[k.dataset.bildirim] = k.checked
    kaydet('bildirim', bildirim)
    // Açınca bir kere çal: kişi sesin nasıl olduğunu duysun.
    if (k.checked) cal(k.dataset.bildirim)
  }
}
const ayarKapat = () => $('ayarlar').classList.remove('acik')
$('ayarAc').onclick = () => $('ayarlar').classList.add('acik')
$('ayarKapat').onclick = ayarKapat
$('ayarlar').onclick = e => { if (e.target === $('ayarlar')) ayarKapat() }
document.addEventListener('keydown', e => { if (e.key === 'Escape') ayarKapat() })
$('odadanCik').onclick = () => odadanCik()

// Sütun genişliği: kenardaki tutamaktan çekilerek değişir, bu cihazda saklanır.
// Çift tıklayınca varsayılana döner. Sohbete en az 300 px kalır.
function kenarCekme(tutamak, sutun, diger, anahtar, enAz, enCok, yon) {
  const sinirla = w => Math.round(Math.max(enAz, Math.min(w, enCok,
    innerWidth - 300 - diger.getBoundingClientRect().width)))
  const kayitli = Number(oku(anahtar, 0))
  if (kayitli) sutun.style.width = sinirla(kayitli) + 'px'
  tutamak.onpointerdown = e => {
    e.preventDefault()
    tutamak.setPointerCapture(e.pointerId)
    tutamak.classList.add('surukleniyor')
    document.body.classList.add('surukleniyor')
    const bas = e.clientX, ilk = sutun.getBoundingClientRect().width
    tutamak.onpointermove = e2 => { sutun.style.width = sinirla(ilk + yon * (e2.clientX - bas)) + 'px' }
    tutamak.onpointerup = tutamak.onpointercancel = () => {
      tutamak.onpointermove = null
      tutamak.classList.remove('surukleniyor')
      document.body.classList.remove('surukleniyor')
      kaydet(anahtar, Math.round(sutun.getBoundingClientRect().width))
    }
  }
  tutamak.ondblclick = () => { sutun.style.width = ''; kaydet(anahtar, 0) }
}
kenarCekme($('solTutamak'), $('sol'), $('uyeler'), 'solGenislik', 180, 400, 1)
kenarCekme($('sagTutamak'), $('uyeler'), $('sol'), 'sagGenislik', 160, 360, -1)
// Masaüstünde uygulamanın sürümü (tauri.conf.json'daki), tarayıcıda "Web".
if (masaustu) window.__TAURI__.app.getVersion().then(v => { $('surum').textContent = 'Sürüm ' + v }).catch(() => {})

// Bildirim sesleri: dosya yok, kısa tonlar burada üretilir (iki nota: giriş yükselen,
// çıkış alçalan, mesaj kısa ve tiz). Sadece hoparlöre çalar; mikrofona ve oyun sesine dokunmaz.
const TONLAR = {
  giris: {notalar: [[587, 0], [880, .09]], sure: .16},
  cikis: {notalar: [[880, 0], [587, .09]], sure: .16},
  mesaj: {notalar: [[1175, 0], [1568, .06]], sure: .09},
}
function cal(tur) {
  if (!ctx || !bildirim[tur]) return
  const {notalar, sure} = TONLAR[tur]
  for (const [hz, gecikme] of notalar) {
    const t = ctx.currentTime + .01 + gecikme
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.frequency.value = hz
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(.12, t + .01)
    g.gain.exponentialRampToValueAtTime(.0001, t + sure)
    o.connect(g).connect(ctx.destination)
    o.start(t)
    o.stop(t + sure + .02)
  }
}
// Odaya ilk girerken zaten seste olanlar için "girdi" sesi çalmasın diye ilk birkaç saniye susulur.
let odaGirisi = 0
const bildirimZamani = () => Date.now() - odaGirisi > 4000

$('isim').value = localStorage.getItem('isim') || ''
$('oda').value = localStorage.getItem('oda') || ''

// Masaüstünde yeni sürüm bulunursa Rust bunu bildirir; kurulup yeniden başlarken uyarı göster.
if (masaustu) window.__TAURI__.event.listen('guncelleme', e => {
  $('guncelleme').textContent = `Yeni sürüm (${e.payload}) kuruluyor, uygulama birazdan yeniden açılacak...`
  $('guncelleme').style.display = 'block'
})

$('katil').onclick = () => {
  const isim = $('isim').value.trim().slice(0, 24)
  const oda = $('oda').value.trim()
  if (!isim || !oda) { durum('Ad ve oda şifresi lazım'); return }
  localStorage.setItem('isim', isim)
  localStorage.setItem('oda', oda)
  sessionStorage.removeItem('cikti')
  katil(isim, oda)
}
// Buton sadece simge olduğu için Enter da giriş yapar.
$('isim').onkeydown = $('oda').onkeydown = e => { if (e.key === 'Enter') $('katil').click() }

// Otomatik giriş: daha önce girilmişse doğrudan odaya bağlan. "Çık"a basılan oturumda
// (sayfa yenilense bile) otomatik girme; uygulama kapatılıp açılınca yine otomatik girer.
if ($('isim').value && $('oda').value && !sessionStorage.getItem('cikti')) {
  durum('Bağlanıyor...', false)
  katil($('isim').value, $('oda').value)
}

async function katil(isim, oda) {
  // Otomatik giriş sürerken butona basılırsa ikinci kez bağlanma.
  if ($('katil').disabled) return
  $('katil').disabled = true
  // Masaüstünde Rust sesi 48 kHz veriyor; AudioContext de 48 kHz olmalı ki
  // hız dönüşümü olmasın (ses kartı farklıysa tarayıcı çıkışta kendisi çevirir).
  ctx = new AudioContext(masaustu
    ? {latencyHint: 'interactive', sampleRate: 48000}
    : {latencyHint: 'interactive'})
  sesKilidiniAc(ctx)

  // Ses zinciri bir kez kurulur. Giden akış hep bağlı kalır; mikrofon sese girince
  // bu zincire takılır, çıkınca sökülür (akış o sırada sessizlik taşır, neredeyse 0 veri).
  // Böylece sese girip çıkarken bağlantıların yeniden kurulması gerekmez.
  micGain = ctx.createGain()
  const micAnaliz = ctx.createAnalyser()
  const cikis = ctx.createMediaStreamDestination()
  micGain.connect(micAnaliz)
  micGain.connect(cikis)
  const gidenSes = cikis.stream
  // Herkesin sesi bu ana düğümden hoparlöre gider; seste değilken kısılır (0).
  dinleme = ctx.createGain()
  dinleme.gain.value = 0
  dinleme.connect(ctx.destination)
  mikKazanci()

  seviyeBagla($('micGain'), $('micYuzde'), girisSeviyesi, v => { girisSeviyesi = v; kaydet('girisSeviye', v); mikKazanci() })
  seviyeBagla($('cikisSeviye'), $('cikisYuzde'), cikisSeviyesi, v => { cikisSeviyesi = v; kaydet('cikisSeviye', v); dinlemeKazanci() })
  $('mute').onclick = () => {
    // Mikrofon açılamadıysa bu buton tekrar dener.
    if (!micKaynak) return mikrofonuAc()
    // Kulaklık kapalıyken mikrofona basmak ikisini birden açar (Discord'daki gibi).
    if (sagir) { sagir = false; kapali = false } else kapali = !kapali
    sesAyarlariniUygula()
  }
  $('sagir').onclick = () => { sagir = !sagir; sesAyarlariniUygula() }
  kulakDugmesi()
  // Seviye kazançtan sonra ölçülür; mikrofon kapalıyken 0 olur, halka yanmaz.
  const benHalka = konusmaIzle($('ben')), odadaHalka = konusmaIzle($('benOdada'))
  seviyeIzle(micAnaliz, v => {
    $('micBar').style.width = Math.min(100, v * 300) + '%'
    benHalka(v)
    odadaHalka(v)
  })

  room = joinRoom({appId: 'yigit-ses-app-2026', password: oda, maxUsers: 6}, oda)
  odaGirisi = Date.now()

  room.onError(err => {
    if (err.code === 'room-full') durum('Oda dolu (max 6 kişi)')
  })

  benimId = (await room.getSelf()).userId
  const benimRenk = gecerliRenk(localStorage.getItem('renk')) || varsayilanRenk(benimId)
  // Kayıtlı fotoğraf da korunur (yoksa her açılışta silinirdi).
  profilGuncelle(benimId, {isim, renk: benimRenk, foto: profiller[benimId]?.foto, g: Date.now()}, true)

  gecmisAnahtari = 'gecmis:' + oda
  gecmis = oku(gecmisAnahtari, []).filter(gecerliMesaj)
  mesajlariCiz()
  uyeAnahtari = 'uyeler:' + oda
  uyeler = oku(uyeAnahtari, {})
  gorundu(benimId)
  // Dakikada bir: açık olanların "son görülme"si yenilenir (biz kapanınca en son hâli kalır)
  // ve "5 dakika önce" gibi yazılar güncellenir.
  setInterval(() => { gorundu(benimId); for (const id of kisiler.keys()) gorundu(id) }, 60e3)

  // Profil (isim + renk): Trystero bunu doğrulanmış userId ile yayar ve sonradan
  // girenlere kendisi iletir. makeUserState sadece varsayılanı tanımlar; set yayınlar.
  // Trystero bir kişi durumunu varsayılan olarak 16 KB ile sınırlar ve büyüğünü sessizce
  // göndermez; fotoğraf (en çok 40 KB) sığsın diye sınır 48 KB. Alan taraf da aynı sınırla
  // kontrol ettiği için 16 KB'tan büyük fotoğrafı eski sürümler göremez.
  profil = room.makeUserState('profil', {isim: '', renk: '', g: 0}, {maxBytes: 48 * 1024})
  profil.set(profiller[benimId]).catch(() => {})
  profil.onChange((data, {userId, self, removed}) => {
    if (self) return
    if (removed) return kisiSil(userId)
    if (!data?.isim) return
    profilGuncelle(userId, data, true)
    kisiEkle(userId)
  })

  // Kim seste: herkes kendi durumunu (imzalı) yayar, sonradan girenlere de iletilir.
  sesDurumu = room.makeUserState('ses', {var: true})
  sesDurumu.onChange((data, {userId, self, removed}) => {
    if (self || removed) return
    const once = seste.get(userId), simdi = data?.var !== false
    seste.set(userId, simdi)
    if (bildirimZamani() && simdi !== once) {
      if (simdi) cal('giris')
      else if (once === true) cal('cikis')
    }
    kisiEkle(userId)
    kisiGuncelle(userId)
  })
  // Mikrofon açılana kadar "seste değil" görün (açılmazsa da öyle kalır).
  sesDurumu.set({var: false}).catch(() => {})

  // Sohbet. Gönderenin kimliği mesajın içinden değil, Trystero'nun doğruladığı
  // userId'den alınır; kimse başkası adına mesaj atamaz.
  const chat = room.makeAction('chat')
  chat.onMessage((m, {userId}) => {
    // Eski sürüm düz metin yollar; onu da kabul et.
    if (typeof m === 'string') m = {id: crypto.randomUUID(), t: m, z: Date.now()}
    const mesaj = {id: m?.id, u: userId, t: String(m?.t ?? '').slice(0, 2000), z: Number(m?.z)}
    if (m?.g !== undefined) mesaj.g = m.g
    if (m?.r !== undefined) mesaj.r = m.r
    if (gecerliMesaj(mesaj) && mesajEkle([mesaj])) cal('mesaj')
    // Fotoğrafın kendisi mesajdan önce geldiyse şimdi yerine koy.
    if (mesaj.r && bekleyenResimler.has(mesaj.id)) {
      const veri = bekleyenResimler.get(mesaj.id)
      bekleyenResimler.delete(mesaj.id)
      resimDogrulaKoy(mesaj.id, veri)
    }
  })

  // Fotoğraflar: mesaj (boyut, tür, özet) sohbetle gider; fotoğrafın kendisi ayrı bir
  // kanalla, ikili veri olarak. Özet (SHA-256) mesajın içinde, mesaj da gönderenin doğrulanmış
  // kimliğiyle geldiği için kimse başkasının fotoğrafını değiştiremez: gelen verinin özeti
  // tutmazsa atılır. Elinde olmayan fotoğrafı (kapalıyken atılmış) odadakilerden ister.
  const resimKanali = room.makeAction('resim')
  const resimIstegi = room.makeAction('resimIste')
  const bekleyenResimler = new Map()   // mesajı henüz gelmemiş fotoğraflar: id -> veri
  async function resimDogrulaKoy(id, veri) {
    const m = gecmis.find(x => x.id === id && x.r)
    if (!m) {
      // Mesajı birkaç saniye içinde gelir; en çok 10 tanesi 1 dakika bekletilir.
      if (bekleyenResimler.size < 10) {
        bekleyenResimler.set(id, veri)
        setTimeout(() => bekleyenResimler.delete(id), 60e3)
      }
      return
    }
    if (veri.byteLength !== m.r.b || await ozetAl(veri) !== m.r.ozet) return
    resimGeldi(m, veri)
  }
  resimKanali.onMessage(async (veri, {metadata}) => {
    const id = metadata?.id
    if (typeof id !== 'string' || id.length > 64) return
    if (veri instanceof Blob) veri = await veri.arrayBuffer()
    else if (ArrayBuffer.isView(veri)) veri = veri.buffer.slice(veri.byteOffset, veri.byteOffset + veri.byteLength)
    if (!(veri instanceof ArrayBuffer) || veri.byteLength > RESIM_MAX) return
    if (eksikResimler.has(id) || !resimler.get(id)?.src) resimDogrulaKoy(id, veri)
  })
  resimIstegi.onMessage(async (v, {peerId}) => {
    const id = v?.id
    if (typeof id !== 'string' || !gecmis.some(x => x.id === id && x.r)) return
    const kayit = await resimKaydi(id)
    if (kayit) resimKanali.send(kayit.veri, {target: peerId, metadata: {id}}).catch(() => {})
  })
  const istenenler = new Map()   // id -> son istek zamanı (aynı fotoğraf 30 sn'de bir istenir)
  resimIste = (id, hedef) => {
    if (!hedef) {
      if (Date.now() - (istenenler.get(id) || 0) < 30e3) return
      istenenler.set(id, Date.now())
    }
    resimIstegi.send({id}, hedef ? {target: hedef} : undefined).catch(() => {})
  }
  resimGonder = async dosya => {
    const {veri, tip, w, h} = await resimHazirla(dosya)
    const id = crypto.randomUUID()
    const r = {tip, w, h, b: veri.byteLength, ozet: await ozetAl(veri)}
    const mesaj = {id, u: benimId, t: '📷 Fotoğraf', z: Date.now(), r}
    await resimSakla(id, veri, tip)
    mesajEkle([mesaj])
    // Önce mesaj, sonra fotoğraf: karşı taraf fotoğrafı neyle karşılaştıracağını bilsin.
    await chat.send({id, t: mesaj.t, z: mesaj.z, r}).catch(() => {})
    resimKanali.send(veri, {metadata: {id}}).catch(() => {})
  }

  // Geçmiş eşitleme: biri girince iki taraf da elindeki geçmişi ve bildiği profilleri
  // karşıya yollar; eksikler id'ye göre birleştirilir. Böylece kapalıyken yazılanlar,
  // o mesajı görmüş biri çevrimiçiyse gelir.
  const esitle = room.makeAction('gecmis')
  esitle.onMessage(veri => {
    if (!veri || !Array.isArray(veri.m)) return
    if (veri.p && typeof veri.p === 'object') {
      for (const [id, p] of Object.entries(veri.p)) {
        // Odada olan kişinin profili zaten doğrulanmış olarak geliyor; ona dokunma.
        if (id !== benimId && !kisiler.has(id)) profilGuncelle(id, p, false)
      }
    }
    mesajEkle(veri.m.slice(-GECMIS_MAX).filter(gecerliMesaj))
    // Karşının bildiği son görülmeler: her kişi için en yenisi alınır (gelecek zaman kabul edilmez).
    if (veri.s && typeof veri.s === 'object') {
      const simdi = Date.now()
      for (const [id, z] of Object.entries(veri.s).slice(0, 500)) {
        if (id.length <= 200 && Number.isFinite(z) && z > (uyeler[id] || 0)) uyeler[id] = Math.min(z, simdi)
      }
      kaydet(uyeAnahtari, uyeler)
      uyeleriCiz()
    }
  })

  room.onUserJoin(({userId}) => kisiEkle(userId))
  // Ses ve geçmiş, kişi değil her yeni BAĞLANTI için gönderilir. Biri uygulamayı kapatıp
  // hızlıca açınca eski bağlantısı bizde birkaç saniye daha açık görünür; Trystero o yüzden
  // "kişi katıldı" (onUserJoin) demez. Eskiden ses orada gönderildiği için yeni bağlantıya
  // hiç gitmiyordu: o kişi bizi duymuyor, biz onu duyuyorduk.
  room.onPeerJoin(({peerId, userId}) => {
    if (userId === benimId) return
    room.addStream(gidenSes, {target: peerId}).catch(() => {})
    gorundu(benimId)
    esitle.send({m: gecmis, p: profiller, s: uyeler}, {target: peerId}).catch(() => {})
    for (const id of [...eksikResimler].slice(-30)) resimIste(id, peerId)
  })
  room.onUserLeave(({userId}) => {
    if (seste.get(userId) === true) cal('cikis')
    kisiSil(userId)
    seste.delete(userId)
  })

  // Her bağlantının ses akışı ayrı tutulur. Bir kişinin yeni bağlantısı gelince onun sesi
  // çalınır; çalınan bağlantı kapanırsa (kişi hâlâ odadaysa) kalan bağlantısına geçilir.
  const akislar = new Map()  // peerId -> {userId, stream}
  room.onPeerStream((stream, {userId, peerId}) => {
    if (userId === benimId) return
    akislar.set(peerId, {userId, stream})
    sesBagla(userId, stream)
  })
  room.onPeerLeave(({peerId, userId}) => {
    const a = akislar.get(peerId)
    akislar.delete(peerId)
    const k = kisiler.get(userId)
    if (!a || !k || k.audio?.srcObject !== a.stream) return
    sesiSok(k)
    const kalan = [...akislar.values()].findLast(x => x.userId === userId)
    if (kalan) sesBagla(userId, kalan.stream)
  })

  const gonder = () => {
    const t = $('mesaj').value.trim().slice(0, 2000)
    if (!t) return
    const mesaj = {id: crypto.randomUUID(), u: benimId, t, z: Date.now()}
    chat.send({id: mesaj.id, t: mesaj.t, z: mesaj.z})
    mesajEkle([mesaj])
    $('mesaj').value = ''
  }
  $('gonder').onclick = gonder
  $('mesaj').onkeydown = e => { if (e.key === 'Enter') gonder() }

  // GIF gönderme. Eski sürümler "g" alanını bilmez; onlara t ("GIF: başlık") yazı olarak görünür.
  gifGonder = gif => {
    const mesaj = {id: crypto.randomUUID(), u: benimId, t: ('GIF: ' + gif.t).slice(0, 200), z: Date.now(), g: gif}
    chat.send({id: mesaj.id, t: mesaj.t, z: mesaj.z, g: gif})
    mesajEkle([mesaj])
  }

  // İsim değiştirme: kutudan çıkınca veya Enter'a basınca kaydedilir ve herkese yayılır.
  $('benIsim').value = isim
  const isimKaydet = () => {
    const yeni = $('benIsim').value.trim().slice(0, 24)
    if (!yeni) { $('benIsim').value = isimAl(benimId); return }
    if (yeni === isimAl(benimId)) return
    localStorage.setItem('isim', yeni)
    benimProfilimiYay({isim: yeni})
  }
  $('benIsim').onchange = isimKaydet
  $('benIsim').onkeydown = e => { if (e.key === 'Enter') $('benIsim').blur() }

  // Renk seçimi: kendi yuvarlağına tıklayınca 12 renk açılır, dışarı tıklayınca kapanır.
  for (const r of RENKLER) {
    const b = document.createElement('button')
    b.style.background = r
    b.dataset.renk = r
    b.onclick = () => {
      localStorage.setItem('renk', r)
      benimProfilimiYay({renk: r})
      $('renkler').classList.remove('acik')
    }
    $('renkler').appendChild(b)
  }
  $('benAv').onclick = e => { e.stopPropagation(); $('renkler').classList.toggle('acik') }

  // Profil fotoğrafı (Ayarlar): seç, küçült, profille herkese yay.
  $('fotoOnizleme').onclick = () => $('fotoDosya').click()
  $('fotoDosya').onchange = async () => {
    const dosya = $('fotoDosya').files[0]
    $('fotoDosya').value = ''
    if (!dosya) return
    $('fotoHata').textContent = ''
    try {
      const foto = await fotoHazirla(dosya)
      await benimProfilimiYay({foto}).catch(() => { throw new Error('gonderilemedi') })
    } catch (e) {
      $('fotoHata').textContent = e.message === 'gonderilemedi' ? 'Fotoğraf gönderilemedi' : 'Bu resim açılamadı'
    }
  }
  $('fotoKaldir').onclick = () => benimProfilimiYay({foto: ''})
  document.addEventListener('pointerdown', e => {
    if (!$('renkler').contains(e.target) && e.target !== $('benAv')) $('renkler').classList.remove('acik')
  })
  benimKartimiCiz()

  $('cik').onclick = sesiKapat
  $('odaSatiri').onclick = sesiAc

  $('giris').style.display = 'none'
  $('app').style.display = 'flex'
  // Açılınca sese otomatik girilmez: odaya bağlanılır, kimin seste olduğu görünür,
  // "Sese katıl"a basınca girilir. Mikrofon da (Mac'in izin penceresi de) ancak o zaman açılır.
  sesArayuzu()
}

// Sese gir: herkesi hemen duymaya başla, mikrofonu ayrıca aç.
// Duymak mikrofona bağlı değil: mikrofon izni beklense (Mac'in izin penceresi bir oyunun
// arkasında kalabilir) ya da mikrofon hiç açılmasa bile kişi seste kalır ve herkesi duyar;
// sadece kendi sesi gitmez ve mikrofon butonu kırmızı görünür (basınca tekrar dener).
function sesiAc() {
  if (sesteyim) return
  sesteyim = true
  dinlemeKazanci()
  sesDurumu.set({var: true}).catch(() => {})
  sesArayuzu()
  cal('giris')
  mikrofonuAc()
}

async function mikrofonuAc() {
  if (!sesteyim || micKaynak) return
  const no = ++acmaNo
  $('mikHata').textContent = ''
  mikDugmesi('aciliyor')
  let kaynak
  try {
    kaynak = masaustu ? await masaustuMikrofon(ctx) : await tarayiciMikrofon(ctx)
  } catch (e) {
    if (no !== acmaNo) return
    $('mikHata').textContent = (masaustu ? 'Mikrofon açılamadı: ' + e : 'Mikrofon izni verilmedi') +
      '. Herkesi duyuyorsun ama seni duymuyorlar. Tekrar denemek için mikrofon simgesine bas.'
    mikDugmesi('yok')
    return
  }
  // Mikrofon açılırken sesten çıkıldıysa (ya da yeni deneme başladıysa) bunu hemen kapat.
  if (no !== acmaNo) return mikrofonuBirak(kaynak)
  micKaynak = kaynak
  micKaynak.connect(micGain)
  mikDugmesi()
}

function mikrofonuBirak(kaynak) {
  kaynak.disconnect()
  if (masaustu) window.__TAURI__.core.invoke('mikrofon_kapat')
  else kaynak.mediaStream.getTracks().forEach(t => t.stop())
}

// Mikrofon butonunun görünüşü: açılıyor (soluk), açılamadı (kırmızı, çizili), açık/kapalı.
function mikDugmesi(durum) {
  const b = $('mute'), yok = durum === 'yok' || (!durum && (kapali || sagir))
  simge(b, yok ? 'mik-yok' : 'mik')
  $('mikGrup').classList.toggle('kapali', yok)
  b.classList.toggle('bekliyor', durum === 'aciliyor')
  b.title = durum === 'aciliyor' ? 'Mikrofon açılıyor...' : durum === 'yok' ? 'Mikrofonu tekrar dene'
    : kapali || sagir ? 'Mikrofonu aç' : 'Mikrofonu kapat'
}

function kulakDugmesi() {
  simge($('sagir'), sagir ? 'kulaklik-yok' : 'kulaklik')
  $('kulakGrup').classList.toggle('kapali', sagir)
  $('sagir').title = sagir ? 'Sağırlaştırmayı kaldır' : 'Sağırlaştır'
}

// Mikrofonun gerçek kazancı: kendi kapattıysa ya da kulaklık kapalıysa 0.
function mikKazanci() {
  if (micGain) micGain.gain.value = kapali || sagir ? 0 : girisSeviyesi / 100
}
// Herkesin sesinin ana düğmesi: seste değilken ya da kulaklık kapalıyken 0.
function dinlemeKazanci() {
  if (dinleme) dinleme.gain.value = sesteyim && !sagir ? cikisSeviyesi / 100 : 0
}
function sesAyarlariniUygula() {
  mikKazanci()
  dinlemeKazanci()
  mikDugmesi()
  kulakDugmesi()
}

// Seviye kaydırıcısı: başlangıç değerini yazar, oynatınca yüzdeyi günceller ve haber verir.
function seviyeBagla(kaydirici, yazi, deger, degisti) {
  kaydirici.value = deger
  yazi.textContent = deger
  boya(kaydirici)
  kaydirici.oninput = () => {
    const v = Number(kaydirici.value)
    yazi.textContent = v
    boya(kaydirici)
    degisti(v)
  }
}

// Mikrofon/kulaklık okunun açtığı menüler: biri açılınca diğeri kapanır,
// dışarı tıklayınca veya Esc'ye basınca kapanır.
function menuleriKapat() {
  for (const id of ['mikMenu', 'kulakMenu', 'mikMenuAc', 'kulakMenuAc']) $(id).classList.remove('acik')
}
function menuAc(menu, ok) {
  const acilacak = !menu.classList.contains('acik')
  menuleriKapat()
  if (acilacak) { menu.classList.add('acik'); ok.classList.add('acik') }
}
$('mikMenuAc').onclick = () => {
  menuAc($('mikMenu'), $('mikMenuAc'))
  $('girisCihaziAc').classList.remove('acik')
  $('girisCihazlari').classList.remove('acik')
  if ($('mikMenu').classList.contains('acik')) girisCihazlariniYukle()
}

// ---- Giriş cihazı (sadece masaüstünde) ----
// Mikrofonu Rust açtığı için liste de Rust'tan gelir; seçim cihazın kalıcı kimliğiyle
// bu bilgisayarda saklanır. Boş = sistemin varsayılan mikrofonu (sistemden değişince o da değişir).
// Seçilen cihaz çıkarılmışsa Rust varsayılan mikrofonu açar.
let seciliMikrofon = String(oku('mikrofon', '') || '')
let mikrofonListesi = []
if (!masaustu) $('girisCihaziKutu').hidden = true
async function girisCihazlariniYukle() {
  if (!masaustu) return
  try { mikrofonListesi = await window.__TAURI__.core.invoke('mikrofonlar') } catch { mikrofonListesi = [] }
  girisCihazlariniCiz()
}
function girisCihazlariniCiz() {
  const secili = mikrofonListesi.find(c => c.id === seciliMikrofon)
  const varsayilan = mikrofonListesi.find(c => c.varsayilan)
  $('girisCihaziAd').textContent = secili ? secili.ad : 'Varsayılan' + (varsayilan ? ' · ' + varsayilan.ad : '')
  const satir = (id, ad, not) => {
    const b = document.createElement('button')
    b.textContent = ad
    if (not) b.append(Object.assign(document.createElement('small'), {textContent: ' · ' + not}))
    b.title = ad
    b.classList.toggle('secili', id === seciliMikrofon || (!secili && id === ''))
    b.onclick = () => girisCihaziSec(id)
    return b
  }
  $('girisCihazlari').replaceChildren(
    satir('', 'Varsayılan', varsayilan?.ad),
    ...mikrofonListesi.map(c => satir(c.id, c.ad)))
}
$('girisCihaziAc').onclick = () => {
  $('girisCihaziAc').classList.toggle('acik')
  $('girisCihazlari').classList.toggle('acik')
}
// Seçince kaydedilir; seste ve mikrofon açıksa hemen yeni cihaza geçilir
// (Rust eski mikrofonu kapatıp yenisini açar, arayüzdeki ses zinciri aynı kalır).
async function girisCihaziSec(id) {
  seciliMikrofon = id
  kaydet('mikrofon', id)
  girisCihazlariniCiz()
  if (!sesteyim) return
  if (!micKaynak) return mikrofonuAc()   // açılamamıştı: yeni cihazla tekrar dene
  const no = ++acmaNo
  $('mikHata').textContent = ''
  mikDugmesi('aciliyor')
  try {
    await masaustuMikrofon(ctx)
  } catch (e) {
    if (no !== acmaNo) return
    micKaynak.disconnect()
    micKaynak = null
    $('mikHata').textContent = 'Mikrofon açılamadı: ' + e + '. Başka bir giriş cihazı seç ya da mikrofon simgesine basıp tekrar dene.'
    mikDugmesi('yok')
    return
  }
  if (no === acmaNo) mikDugmesi()
}
$('kulakMenuAc').onclick = () => menuAc($('kulakMenu'), $('kulakMenuAc'))
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ben .menu, #mikMenuAc, #kulakMenuAc')) menuleriKapat()
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') menuleriKapat() })

// Sesten çık: mikrofonu tamamen kapat, kimseyi duyma. Sohbet açık kalır.
function sesiKapat() {
  if (!sesteyim) return
  sesteyim = false
  acmaNo++
  if (micKaynak) { mikrofonuBirak(micKaynak); micKaynak = null }
  // Açılmakta olan mikrofon varsa Rust tarafına da kapat de (yukarıdaki kontrol de kapatır).
  else if (masaustu) window.__TAURI__.core.invoke('mikrofon_kapat')
  $('mikHata').textContent = ''
  dinlemeKazanci()
  menuleriKapat()
  sesDurumu.set({var: false}).catch(() => {})
  sesArayuzu()
  cal('cikis')
}

function sesArayuzu() {
  $('app').classList.toggle('sessiz', !sesteyim)
  uyeleriCiz()
  if (!sesteyim) {
    $('ben').classList.remove('konusuyor')
    $('benOdada').classList.remove('konusuyor')

  }
}

// Profil fotoğrafı: sadece küçük JPEG kabul edilir (başkasından gelen veri CSS'e yazıldığı
// için içerik sıkı kontrol edilir; sadece base64 karakterleri).
const FOTO_MAX = 40000
const gecerliFoto = f => typeof f === 'string' && f.length <= FOTO_MAX &&
  /^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(f) ? f : ''

// Seçilen resmi ortadan kare kırpıp 256x256 JPEG'e küçültür (büyütünce de net görünsün).
// 40 KB sınırına sığana kadar kalite düşürülür (eski sürümler de bu sınırla kabul eder).
// Küçük olduğu için profille birlikte herkese anında gider ve cihazda saklanır.
async function fotoHazirla(dosya) {
  const resim = await createImageBitmap(dosya)
  const kenar = Math.min(resim.width, resim.height)
  const tuval = document.createElement('canvas')
  tuval.width = tuval.height = 256
  const c = tuval.getContext('2d')
  c.imageSmoothingQuality = 'high'
  c.drawImage(resim, (resim.width - kenar) / 2, (resim.height - kenar) / 2, kenar, kenar, 0, 0, 256, 256)
  resim.close()
  for (const kalite of [.85, .75, .65, .5, .4]) {
    const veri = tuval.toDataURL('image/jpeg', kalite)
    if (gecerliFoto(veri)) return veri
  }
  throw new Error('çok büyük')
}

// Profil kaydını günceller. kesin=true: doğrulanmış kaynak (kişinin kendisi);
// kesin=false: başkasından duyulan, sadece daha yeniyse alınır.
function profilGuncelle(id, p, kesin) {
  if (!p || typeof p.isim !== 'string' || !p.isim.trim()) return
  const yeni = {isim: p.isim.trim().slice(0, 24), renk: gecerliRenk(p.renk) || varsayilanRenk(id),
                foto: gecerliFoto(p.foto), g: Number(p.g) || 0}
  const eski = profiller[id]
  if (!kesin && eski && eski.g >= yeni.g) return
  if (eski && eski.isim === yeni.isim && eski.renk === yeni.renk && (eski.foto || '') === yeni.foto &&
      eski.g === yeni.g) return
  profiller[id] = yeni
  kaydet('profiller', profiller)
  kisiGuncelle(id)
  uyeleriCiz()
  mesajlariCiz()
}

function gecerliMesaj(m) {
  return m && typeof m.id === 'string' && m.id.length <= 64 &&
    typeof m.u === 'string' && m.u.length <= 200 &&
    typeof m.t === 'string' && m.t.length > 0 && Number.isFinite(m.z) &&
    (m.g === undefined || gecerliGif(m.g)) &&
    (m.r === undefined || (m.g === undefined && gecerliResim(m.r)))
}

// GIF bilgisi başkasından geldiği için sıkı kontrol: sadece Klipy'nin medya sunucularından
// veya uygulamanın içindeki kendi GIF'lerimizden bir adres kabul edilir
// (başka sitelerden resim yüklenip IP adresi sızdırılamasın).
function gecerliGif(g) {
  return !!g && typeof g === 'object' && typeof g.s === 'string' && g.s.length <= 200 &&
    typeof g.t === 'string' && g.t.length <= 200 &&
    typeof g.u === 'string' && g.u.length <= 500 &&
    (/^https:\/\/static\d?\.klipy\.com\/[\w\-./]+$/.test(g.u) || MONKE_GIFLER.some(x => x.u === g.u)) &&
    Number.isInteger(g.w) && Number.isInteger(g.h) && g.w > 0 && g.h > 0 && g.w <= 4000 && g.h <= 4000
}

// Yeni mesajları id'ye göre birleştirir, zamana göre sıralar, son 1000'i saklar.
// Kaç yeni mesaj eklendiğini döndürür (aynı mesaj iki kez gelirse 0).
function mesajEkle(liste) {
  const varOlan = new Set(gecmis.map(m => m.id))
  const yeniler = []
  for (const m of liste) if (!varOlan.has(m.id)) { varOlan.add(m.id); yeniler.push(m) }
  if (!yeniler.length) return 0
  gecmis = gecmis.concat(yeniler).sort((a, b) => a.z - b.z).slice(-GECMIS_MAX)
  kaydet(gecmisAnahtari, gecmis)
  mesajlariCiz()
  uyeleriCiz()
  return yeniler.length
}

// Tarayıcıda (web linki): mikrofon tarayıcının kendi ses işlemesiyle açılır.
async function tarayiciMikrofon(ctx) {
  const mic = await navigator.mediaDevices.getUserMedia({audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: false,
    channelCount: 1, sampleRate: 48000
  }})
  return ctx.createMediaStreamSource(mic)
}

// Masaüstünde: mikrofonu Rust açar (cpal + RNNoise), 10 ms'lik paketleri Channel ile
// yollar; worklet bunları Web Audio akışına çevirir. Tarayıcı motoru mikrofona hiç
// dokunmadığı için Windows/Mac "görüşme modu"na geçmez, oyun sesi kısılmaz.
// Worklet düğümü bir kez kurulur; her sese girişte sadece yeni bir kanal açılır.
let mikDugumu
async function masaustuMikrofon(ctx) {
  if (!mikDugumu) {
    await ctx.audioWorklet.addModule('mikrofon-worklet.js')
    mikDugumu = new AudioWorkletNode(ctx, 'masaustu-mikrofon', {
      numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1]
    })
  }
  const {invoke, Channel} = window.__TAURI__.core
  const kanal = new Channel()
  kanal.onmessage = paket => mikDugumu.port.postMessage(paket, [paket])
  await invoke('mikrofon_ac', {kanal, cihaz: seciliMikrofon || null})
  return mikDugumu
}

function kisiEkle(userId) {
  if (kisiler.has(userId)) return kisiler.get(userId).el
  const el = document.createElement('div')
  el.className = 'kisi'
  el.innerHTML = `<div class="ust"><span class="av"></span><span class="ad">...</span>
      <button class="ib k sus"></button></div>
    <div class="ses"><input type="range" min="0" max="200"><span class="yuzde"></span></div>`
  $('kisiler').appendChild(el)
  const gain = ctx.createGain()
  gain.connect(dinleme)
  const kaydirici = el.querySelector('input'), sus = el.querySelector('.sus')

  // Kayıtlı ayar varsa onunla başla. Sustur kaydırıcıyı değiştirmez; açınca eski seviyeye döner.
  const ayar = {v: 100, s: false, ...sesler[userId]}
  const uygula = () => {
    gain.gain.value = ayar.s ? 0 : ayar.v / 100
    kaydirici.value = ayar.v
    boya(kaydirici)
    el.querySelector('.yuzde').textContent = ayar.v
    el.classList.toggle('susturuldu', ayar.s)
    simge(sus, ayar.s ? 'hop-yok' : 'hop')
    sus.title = ayar.s ? 'Sesini aç' : 'Sustur'
  }
  const sakla = () => { sesler[userId] = {v: ayar.v, s: ayar.s}; kaydet('sesler', sesler); uygula() }
  // Kaydırıcıyı oynatmak susturmayı da kaldırır (sesini duymak istediği belli).
  kaydirici.oninput = () => { ayar.v = Number(kaydirici.value); ayar.s = false; sakla() }
  sus.onclick = () => { ayar.s = !ayar.s; sakla() }
  uygula()

  kisiler.set(userId, {el, gain})
  kisiGuncelle(userId)
  gorundu(userId)
  return el
}

// Kişi kartındaki isim, baş harf ve rengi profile göre yeniler.
function kisiGuncelle(userId) {
  const k = kisiler.get(userId)
  if (!k) return
  k.el.classList.toggle('yazida', !sesteMi(userId))
  uyeleriCiz()
  if (!profiller[userId]) return
  k.el.querySelector('.ad').textContent = isimAl(userId)
  avatarCiz(k.el.querySelector('.av'), userId)
}

// Kişiyi şu an görülmüş say (son görülme) ve listeyi yenile.
function gorundu(id) {
  if (!uyeAnahtari) return
  uyeler[id] = Date.now()
  kaydet(uyeAnahtari, uyeler)
  uyeleriCiz()
}

// "15 dakika önce", "3 saat önce", "2 gün önce". Tarih yazılmaz.
function neZaman(z) {
  const dk = Math.floor((Date.now() - z) / 60e3)
  if (dk < 1) return 'az önce'
  if (dk < 60) return dk + ' dakika önce'
  if (dk < 60 * 24) return Math.floor(dk / 60) + ' saat önce'
  return Math.floor(dk / 60 / 24) + ' gün önce'
}

// Sağdaki üye listesi ve soldaki "Seste kimse yok" yazısı. Çok sık çağrılabilir;
// hepsi birikip tek seferde çizilir. (requestAnimationFrame değil: pencere arkadayken durur.)
let uyeCizimi = 0
function uyeleriCiz() {
  if (uyeCizimi) return
  uyeCizimi = setTimeout(() => {
    uyeCizimi = 0
    // Üyeler: son görülmesi bilinen herkes + şu an bağlı olanlar + bu odada mesaj yazmış olanlar.
    const hepsi = new Set([...Object.keys(uyeler), ...kisiler.keys(), ...gecmis.map(m => m.u), benimId])
    hepsi.delete('')
    // Son görülme: kaydedilen an ile son mesajının saatinden hangisi yeniyse. Son görülme
    // kaydı 0.1.10'da başladı; ondan önce çevrimiçi olanlar için en azından son mesajı bilinir.
    const son = {...uyeler}
    for (const m of gecmis) if (m.z > (son[m.u] || 0)) son[m.u] = Math.min(m.z, Date.now())
    const acik = [], kapali = []
    for (const id of hepsi) (id === benimId || kisiler.has(id) ? acik : kapali).push(id)
    acik.sort((a, b) => isimAl(a).localeCompare(isimAl(b), 'tr'))
    kapali.sort((a, b) => (son[b] || 0) - (son[a] || 0))
    const parca = []
    const bolum = (baslik, liste, cevrimici) => {
      if (!liste.length) return
      const h = document.createElement('div')
      h.className = 'uyeBaslik'
      h.textContent = `${baslik} — ${liste.length}`
      parca.push(h)
      for (const id of liste) {
        const el = document.createElement('div')
        el.className = 'uye' + (cevrimici ? '' : ' cevrimdisi')
        el.innerHTML = '<span class="av"></span><div class="uyeYazi"><span class="ad"></span></div>'
        avatarCiz(el.querySelector('.av'), id)
        const ad = el.querySelector('.ad')
        ad.textContent = isimAl(id) + (id === benimId ? ' (sen)' : '')
        ad.style.color = renkAl(id)
        if (!cevrimici && son[id]) {
          const z = document.createElement('span')
          z.className = 'zaman'
          z.textContent = neZaman(son[id])
          el.querySelector('.uyeYazi').append(z)
        }
        parca.push(el)
      }
    }
    bolum('Çevrimiçi', acik, true)
    bolum('Çevrimdışı', kapali, false)
    $('uyeler').replaceChildren(...parca)
  })
}

// Tarayıcılar, kullanıcı bir yere tıklamadan sesi başlatmayabilir (otomatik girişte
// olur). O durumda uyarı gösterilir; ilk tıklama/tuşta ses açılır.
function sesKilidiniAc(ctx) {
  const guncelle = () => { $('sesUyari').style.display = ctx.state === 'running' ? 'none' : 'block' }
  ctx.onstatechange = guncelle
  const ac = () => { if (ctx.state !== 'running') ctx.resume() }
  document.addEventListener('pointerdown', ac)
  document.addEventListener('keydown', ac)
  setTimeout(guncelle, 500)
}

function sesBagla(userId, stream) {
  kisiEkle(userId)
  const k = kisiler.get(userId)
  // Aynı kişiden yeni bağlantıyla yeni akış geldiyse eskisini sök (yeniden açılınca olur).
  if (k.audio?.srcObject === stream) return
  sesiSok(k)
  const a = new Audio()
  a.srcObject = stream
  a.muted = true
  a.play()
  k.audio = a
  const kaynak = ctx.createMediaStreamSource(stream)
  const analiz = ctx.createAnalyser()
  kaynak.connect(k.gain)
  kaynak.connect(analiz)
  k.kaynak = kaynak
  k.izlemeyiDurdur = seviyeIzle(analiz, konusmaIzle(k.el))
}

function kisiSil(userId) {
  const k = kisiler.get(userId)
  if (!k) return
  sesiSok(k)
  k.gain.disconnect()
  k.el.remove()
  kisiler.delete(userId)
  gorundu(userId)  // çıktığı an = en son görüldüğü an
}

function sesiSok(k) {
  k.izlemeyiDurdur?.()
  k.kaynak?.disconnect()
  if (k.audio) k.audio.srcObject = null
  k.izlemeyiDurdur = k.kaynak = k.audio = null
}

// Konuşma halkası: normal konuşma sesinde yanar (eşik düşük), ses kesilince 0,3 sn daha
// yanık kalır ki kelime aralarında yanıp sönmesin.
function konusmaIzle(el) {
  let son = -Infinity
  return v => {
    const simdi = performance.now()
    if (v > 0.015) son = simdi
    el.classList.toggle('konusuyor', simdi - son < 300)
  }
}

// 100 ms'de bir ses seviyesini ölçer. Dönen fonksiyon ölçümü durdurur
// (kişi odadan çıkınca çağrılır; yoksa ölçüm arka planda sonsuza kadar sürerdi).
function seviyeIzle(analiz, cb) {
  const buf = new Float32Array(analiz.fftSize)
  let zamanlayici
  const tick = () => {
    analiz.getFloatTimeDomainData(buf)
    let s = 0
    for (const x of buf) s += x * x
    cb(Math.sqrt(s / buf.length))
    zamanlayici = setTimeout(tick, 100)
  }
  tick()
  return () => clearTimeout(zamanlayici)
}

// Bütün geçmişi çizer. İsimler/renkler çizim anında profilden alınır; biri ismini
// değiştirince eski mesajları da yeni isimle görünür. Aynı kişinin 5 dakika içindeki
// art arda mesajları tek başlık altında toplanır (isim tekrar tekrar yazılmaz).
function mesajlariCiz() {
  const kutu = $('mesajlar')
  const bugun = new Date().toDateString()
  let onceki

// Yazıyı emojileri ayrı (büyük) gösterecek şekilde yerleştirir. Sadece emoji varsa
// (en çok 27 tane, Discord'daki gibi) hepsi iri görünür. Yazı her zaman textContent ile
// eklenir, HTML olarak yorumlanmaz.
const EMOJI = /\p{RI}\p{RI}|\p{Extended_Pictographic}(?:\uFE0F|\p{EMod})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{EMod})?)*/gu
function emojiliYaz(el, yazi) {
  let son = 0, sayi = 0
  for (const e of yazi.matchAll(EMOJI)) {
    if (e.index > son) el.append(yazi.slice(son, e.index))
    el.append(Object.assign(document.createElement('span'), {className: 'emoji', textContent: e[0]}))
    son = e.index + e[0].length
    sayi++
  }
  if (son < yazi.length) el.append(yazi.slice(son))
  if (sayi && sayi <= 27 && !yazi.replace(EMOJI, '').trim()) el.classList.add('sadeceEmoji')
}

// ---- Sohbette fotoğraf ----
// Sunucu yok: fotoğraf doğrudan odadakilere gider ve her bilgisayarda ayrı bir depoda
// (IndexedDB) saklanır; mesaj geçmişinin (localStorage) 5 MB sınırı fotoğraflara yetmez.
const RESIM_TIPLERI = ['image/jpeg', 'image/png', 'image/webp', 'image/gif']
const RESIM_MAX = 1900 * 1024   // Trystero tek mesajda en çok 2 MB taşır
const RESIM_KENAR = 1600        // gönderilmeden önce en uzun kenar bu kadara küçültülür
const RESIM_SAKLA = 200         // bu bilgisayarda saklanan en çok fotoğraf (eskiler silinir)
let resimGonder = async () => {}   // odaya girince tanımlanır
let resimIste = () => {}
const resimler = new Map()         // mesaj id -> <img> (her çizimde baştan yüklenmesin)
const eksikResimler = new Set()    // elimizde olmayan fotoğraflar (odadakilerden istenir)

function gecerliResim(r) {
  return !!r && typeof r === 'object' && RESIM_TIPLERI.includes(r.tip) &&
    typeof r.ozet === 'string' && /^[0-9a-f]{64}$/.test(r.ozet) &&
    Number.isInteger(r.b) && r.b > 0 && r.b <= RESIM_MAX &&
    Number.isInteger(r.w) && Number.isInteger(r.h) && r.w > 0 && r.h > 0 && r.w <= 10000 && r.h <= 10000
}
async function ozetAl(veri) {
  const o = new Uint8Array(await crypto.subtle.digest('SHA-256', veri))
  return Array.from(o, b => b.toString(16).padStart(2, '0')).join('')
}

let depoSozu
function depo() {
  return depoSozu ??= new Promise((ok, hata) => {
    const r = indexedDB.open('monke', 1)
    r.onupgradeneeded = () => r.result.createObjectStore('resimler', {keyPath: 'id'}).createIndex('z', 'z')
    r.onsuccess = () => ok(r.result)
    r.onerror = () => hata(r.error)
  })
}
async function resimKaydi(id) {
  try {
    const d = await depo()
    return await new Promise((ok, hata) => {
      const r = d.transaction('resimler').objectStore('resimler').get(id)
      r.onsuccess = () => ok(r.result || null)
      r.onerror = () => hata(r.error)
    })
  } catch { return null }
}
// Veri ArrayBuffer olarak saklanır (bazı WebKit sürümleri IndexedDB'de Blob saklamakta sorun çıkarıyor).
async function resimSakla(id, veri, tip) {
  try {
    const d = await depo()
    await new Promise((ok, hata) => {
      const tx = d.transaction('resimler', 'readwrite')
      tx.objectStore('resimler').put({id, veri, tip, z: Date.now()})
      tx.oncomplete = ok
      tx.onerror = () => hata(tx.error)
    })
    // Sınırı aşınca en eski fotoğraflar silinir.
    const tx = d.transaction('resimler', 'readwrite'), st = tx.objectStore('resimler'), say = st.count()
    say.onsuccess = () => {
      let fazla = say.result - RESIM_SAKLA
      if (fazla > 0) st.index('z').openCursor().onsuccess = e => {
        const c = e.target.result
        if (c && fazla-- > 0) { c.delete(); c.continue() }
      }
    }
  } catch {}
}

// Mesajdaki fotoğraf. Boyutu önceden verilir ki yüklenirken sohbet zıplamasın.
function resimElemani(m) {
  let img = resimler.get(m.id)
  if (img) return img
  const olcek = Math.min(1, 320 / m.r.w, 280 / m.r.h)
  img = new Image(Math.max(40, Math.round(m.r.w * olcek)), Math.max(40, Math.round(m.r.h * olcek)))
  img.className = 'resim'
  img.alt = 'Fotoğraf'
  img.dataset.id = m.id
  img.onload = () => img.classList.add('yuklendi')
  resimler.set(m.id, img)
  resimKaydi(m.id).then(k => {
    if (k) img.src = URL.createObjectURL(new Blob([k.veri], {type: k.tip}))
    else {
      // Yeni gelen mesajın fotoğrafı hemen arkasından gelir; birkaç saniye bekleyip
      // hâlâ yoksa odadakilerden iste.
      eksikResimler.add(m.id)
      setTimeout(() => { if (eksikResimler.has(m.id)) resimIste(m.id) }, 4000)
    }
  })
  return img
}
async function resimGeldi(m, veri) {
  eksikResimler.delete(m.id)
  await resimSakla(m.id, veri, m.r.tip)
  const img = resimler.get(m.id)
  if (img && !img.src) img.src = URL.createObjectURL(new Blob([veri], {type: m.r.tip}))
}

// Gönderilecek fotoğrafı hazırlar: en uzun kenar 1600 piksele küçültülür ve yeniden
// kodlanır (bu sırada konum gibi gizli bilgiler de silinir). Ekran görüntüleri (PNG)
// yazılar bulanıklaşmasın diye PNG kalır; çok büyükse JPEG'e çevrilir.
// GIF hareketli kalsın diye olduğu gibi gider.
async function resimHazirla(dosya) {
  if (!RESIM_TIPLERI.includes(dosya.type)) throw new Error('Sadece fotoğraf gönderilebilir (JPEG, PNG, WebP, GIF)')
  const bmp = await createImageBitmap(dosya).catch(() => { throw new Error('Fotoğraf açılamadı') })
  if (dosya.type === 'image/gif') {
    const w = bmp.width, h = bmp.height
    bmp.close()
    if (dosya.size > RESIM_MAX) throw new Error('GIF en fazla 1,9 MB olabilir')
    return {veri: await dosya.arrayBuffer(), tip: 'image/gif', w, h}
  }
  const olcek = Math.min(1, RESIM_KENAR / Math.max(bmp.width, bmp.height))
  const w = Math.max(1, Math.round(bmp.width * olcek)), h = Math.max(1, Math.round(bmp.height * olcek))
  const tuval = document.createElement('canvas')
  tuval.width = w
  tuval.height = h
  const c = tuval.getContext('2d')
  const ciz = zemin => {
    c.clearRect(0, 0, w, h)
    if (zemin) { c.fillStyle = '#fff'; c.fillRect(0, 0, w, h) }  // JPEG'de saydam yerler siyah olmasın
    c.drawImage(bmp, 0, 0, w, h)
  }
  const blobAl = (tip, kalite) => new Promise(ok => tuval.toBlob(ok, tip, kalite))
  let blob = null
  if (dosya.type === 'image/png') { ciz(false); blob = await blobAl('image/png') }
  if (!blob || blob.size > 1024 * 1024) {
    ciz(true)
    for (const kalite of [.85, .75, .6, .45]) {
      blob = await blobAl('image/jpeg', kalite)
      if (blob && blob.size <= 700 * 1024) break
    }
  }
  bmp.close()
  if (!blob || blob.size > RESIM_MAX) throw new Error('Fotoğraf çok büyük')
  return {veri: await blob.arrayBuffer(), tip: blob.type, w, h}
}

// Fotoğraf seçme, yapıştırma (Cmd/Ctrl+V) ve sürükleyip bırakma. Tek seferde en çok 5 tane.

async function resimleriGonder(dosyalar) {

    if (c.status === 429) throw new Error('sinir')
    const veri = await c.json()
    if (no !== gifIstekNo) return
    const liste = (veri?.data?.data || []).map(gifBilgisi).filter(Boolean)
    gifSayfa = sayfa

    $('gifDurum').textContent = e.message === 'sinir'
      ? 'GIF arama sınırı doldu, biraz sonra tekrar dene' : 'GIF\'ler yüklenemedi'
  } finally {
    if (no === gifIstekNo) gifYukleniyor = false
  }
}

// Klipy sonucundan gereken kısmı çıkarır: önizleme (küçük) ve mesajda gösterilecek (orta) adres.
function gifBilgisi(o) {
  const f = o?.file
  const orta = f?.md?.webp || f?.md?.gif, kucuk = f?.sm?.webp || f?.sm?.gif || orta
  if (!orta || !kucuk) return null
  const g = {s: String(o.slug || ''), t: String(o.title || 'GIF').slice(0, 200), u: orta.url, w: orta.width, h: orta.height}
  return gecerliGif(g) ? {g, onizleme: kucuk.url} : null
}

// Panelin en üstünde bizim GIF'lerimiz, altında "Klipy" başlığıyla Klipy'nin popülerleri.
// Arama yapınca sadece Klipy sonuçları görünür.
function monkeGifleriEkle() {
  const baslik = ad => Object.assign(document.createElement('div'), {className: 'gifBaslik', textContent: ad})
  $('gifIzgara').insertBefore(baslik('Monke'), $('gifDurum'))
  for (const g of MONKE_GIFLER) {
    const b = document.createElement('button')
    b.title = g.t
    const img = new Image()
    img.alt = g.t
    img.src = g.u
    b.append(img)
    b.onclick = () => { gifGonder(g); gifPaneliKapat() }
    $('gifIzgara').insertBefore(b, $('gifDurum'))
  }
  $('gifIzgara').insertBefore(baslik('Klipy'), $('gifDurum'))
}

function gifEkle(liste) {
  const sorgu = gifSorgu
  for (const {g, onizleme} of liste) {
    const b = document.createElement('button')
    b.title = g.t
    const img = new Image()
    img.loading = 'lazy'
    img.alt = g.t
    img.src = onizleme
    b.append(img)
    b.onclick = () => {
      gifGonder(g)
      gifPaneliKapat()
      // Klipy'ye "paylaşıldı" bilgisi (kişisel veri yok, sadece cihaz numarası ve arama kelimesi).
      fetch(`${KLIPY}/share/${encodeURIComponent(g.s)}`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({customer_id: klipyId, q: sorgu}),
      }).catch(() => {})
    }
    $('gifIzgara').insertBefore(b, $('gifDurum'))
  }
}
</script>
