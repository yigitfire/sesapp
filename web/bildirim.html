<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monke</title>
<style>
  /* Sağ üstte çıkan bildirim penceresi (masaüstü). Ana sayfa bildirimi Rust üzerinden
     buraya yollar; burada çizilir, 5 saniye sonra (fare üstündeyse beklenir) kapanır. */
  @font-face{font-family:'Noto Sans';font-weight:100 900;font-display:block;src:url(vendor/noto-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Noto Sans';font-weight:100 900;font-display:block;src:url(vendor/noto-sans-tr.woff2) format('woff2');
    unicode-range:U+011E-011F,U+0130,U+015E-015F}
  html,body{margin:0;height:100%;overflow:hidden;background:#111111}
  body{color:#dcdcdc;font:13px/1.35 'Noto Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
       user-select:none;-webkit-user-select:none;cursor:pointer}
  #kutu{box-sizing:border-box;height:100%;display:flex;align-items:center;gap:11px;padding:0 14px 0 13px;
        border-left:3px solid #c6f432;border-top:1px solid #262626;border-right:1px solid #262626;border-bottom:1px solid #262626}
  #kutu.yeni{animation:gel .22s ease-out}
  @keyframes gel{from{opacity:0;transform:translateX(24px)}}
  body:hover #kutu{background:#181818}
  .av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;
      color:#111111;background-size:cover;background-position:center}
  .yazi{min-width:0;flex:1}
  .ust{display:flex;align-items:baseline;gap:7px;margin-bottom:1px}
  .ad{font-weight:700;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ne{flex:none;font-size:11px;font-weight:600;color:#c6f432}
  .metin{color:#a8a8a8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .logo{position:absolute;top:8px;right:10px;width:15px;height:15px;opacity:.55}
</style>
</head>
<body>
<div id="kutu">
  <div class="av"></div>
  <div class="yazi">
    <div class="ust"><span class="ad"></span><span class="ne"></span></div>
    <div class="metin"></div>
  </div>
</div>
<img class="logo" src="logo.svg" alt="">
<script>
  const {invoke} = window.__TAURI__.core
  const kutu = document.getElementById('kutu')
  const SURE = 5000
  let zamanlayici, acik = false, ustunde = false

  const kapat = () => { acik = false; clearTimeout(zamanlayici); invoke('bildirim_kapat') }
  const kur = ms => { clearTimeout(zamanlayici); zamanlayici = setTimeout(kapat, ms) }

  // veri: {ad, renk, harf, foto, ne, metin}
  window.__TAURI__.event.listen('bildirim', ({payload: v}) => {
    const av = kutu.querySelector('.av')
    av.style.backgroundColor = v.renk || '#c6f432'
    av.style.backgroundImage = v.foto ? `url("${v.foto}")` : ''
    av.textContent = v.foto ? '' : (v.harf || '?')
    kutu.querySelector('.ad').textContent = v.ad || ''
    kutu.querySelector('.ne').textContent = v.ne || ''
    kutu.querySelector('.metin').textContent = v.metin || ''
    // Kapalıyken açılırsa kayarak gelsin; açıkken yenisi gelirse sadece içerik değişsin.
    if (!acik) { kutu.classList.remove('yeni'); void kutu.offsetWidth; kutu.classList.add('yeni') }
    acik = true
    invoke('bildirim_ac')
    if (!ustunde) kur(SURE)
  })
  // Fare üstündeyken kapanmaz; çekilince kısa süre sonra kapanır.
  document.body.addEventListener('mouseenter', () => { ustunde = true; clearTimeout(zamanlayici) })
  document.body.addEventListener('mouseleave', () => { ustunde = false; if (acik) kur(1500) })
  document.body.addEventListener('click', () => { acik = false; clearTimeout(zamanlayici); invoke('bildirim_tikla') })
</script>
</body>
</html>
