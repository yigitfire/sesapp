[package]
name = "sesapp"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5"
cpal = "0.18.2"
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "0.4.1"
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[dev-dependencies]
hound = "3.5.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
