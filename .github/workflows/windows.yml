# Windows kurulum dosyasını (.exe) GitHub'ın Windows makinesinde derler ve
# GitHub Releases'e koyar. Mac'ten Windows derlemesi alınamadığı için burada yapılıyor.
#
# Yeni sürüm çıkarmak için: tauri.conf.json'daki "version"ı artır, sonra
#   git tag v0.1.1 && git push origin v0.1.1
# Sabit indirme linki her zaman en son sürümü verir:
#   https://github.com/yigitfire/sesapp/releases/latest/download/Ses-Kurulum.exe
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Rust windows-latest üzerinde hazır geliyor; derleme önbelleği sonraki derlemeleri hızlandırır.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Derle (NSIS kurulum dosyası)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Sabit isimli kopya
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Ses-Kurulum.exe
          Get-Item Ses-Kurulum.exe | Format-List Name, Length

      - name: Derlemeyi sakla (etiketsiz elle çalıştırmada)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: Ses-Kurulum
          path: Ses-Kurulum.exe

      - name: GitHub Release'e yükle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" Ses-Kurulum.exe `
            --title "Ses ${{ github.ref_name }}" `
            --notes "Windows kurulum dosyası: Ses-Kurulum.exe. İlk açılışta Windows 'bilinmeyen yayımcı' uyarısı verirse: Ek bilgi -> Yine de çalıştır."
