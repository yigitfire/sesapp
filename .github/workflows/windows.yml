# Windows sürümünü GitHub'ın Windows makinesinde derler ve GitHub Releases'e koyar.
# Mac'ten Windows derlemesi alınamadığı için burada yapılıyor.
#
# İki dosya çıkar:
#   Ses.exe          Kurulumsuz tek dosya: çift tıkla, açılsın. Arkadaşlara atılan bu.
#                    (Arayüz exe'nin içine gömülü; ayarlar/geçmiş %LOCALAPPDATA%'da durur,
#                    exe nereye taşınırsa taşınsın hesap aynı kalır.)
#   Ses-Kurulum.exe  Klasik kurulum: Başlat menüsü kısayolu ister + WebView2 yoksa kurar.
#
# Yeni sürüm çıkarmak için: tauri.conf.json'daki "version"ı artır, sonra
#   git tag v0.1.2 && git push origin v0.1.2
# Var olan bir sürümün dosyalarını yeniden derleyip değiştirmek için: Actions'ta
# "Windows" iş akışını elle çalıştır ve etiketi yaz.
# Sabit indirme linkleri her zaman en son sürümü verir:
#   https://github.com/yigitfire/sesapp/releases/latest/download/Ses.exe
#   https://github.com/yigitfire/sesapp/releases/latest/download/Ses-Kurulum.exe
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiket:
        description: "Dosyaları yüklenecek mevcut sürüm etiketi (örn. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    env:
      ETIKET: ${{ github.event.inputs.etiket || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ETIKET }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Rust windows-latest üzerinde hazır geliyor; derleme önbelleği sonraki derlemeleri hızlandırır.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Derle
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Sabit isimli dosyalar
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/sesapp.exe Ses.exe
          $kurulum = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $kurulum.FullName Ses-Kurulum.exe
          Get-Item Ses.exe, Ses-Kurulum.exe | Format-Table Name, Length

      - name: GitHub Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:ETIKET" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:ETIKET" Ses.exe Ses-Kurulum.exe --clobber
          } else {
            gh release create "$env:ETIKET" Ses.exe Ses-Kurulum.exe `
              --title "Ses $env:ETIKET" `
              --notes "Ses.exe: kurulum yok, çift tıkla aç. İlk açılışta Windows uyarı verirse: Ek bilgi -> Yine de çalıştır."
          }
