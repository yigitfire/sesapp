# web/ klasörünü GitHub Pages'e yayınlar (https://yigitfire.github.io/sesapp/).
# main'e web/ içinde bir değişiklik gelince kendiliğinden çalışır.
name: Web sitesi

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: dagit
        uses: actions/deploy-pages@v5
