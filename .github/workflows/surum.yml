# Yeni sürüm yayınlar: Windows ve Mac'i derler, güncelleme dosyalarını bizim gizli
# anahtarımızla imzalar, latest.json'u oluşturur ve hepsini GitHub Releases'e koyar.
# Kurulu uygulamalar açılışta latest.json'a bakıp kendilerini otomatik günceller.
#
# Yeni sürüm çıkarmak için:
#   1. src-tauri/tauri.conf.json ve src-tauri/Cargo.toml'daki "version"ı artır (örn. 0.1.3)
#   2. git tag v0.1.3 && git push origin v0.1.3
#
# Sabit linkler (her zaman en son sürüm):
#   Windows ilk kurulum: https://github.com/yigitfire/sesapp/releases/latest/download/Monke-Kurulum.exe
#   (Eski link Ses-Kurulum.exe de aynı dosyayı verir; uygulamanın eski adı "Ses" idi.)
#   Güncelleme bilgisi:  https://github.com/yigitfire/sesapp/releases/latest/download/latest.json
name: Sürüm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Derle ve imzala
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Sabit isim
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory cikti | Out-Null
          Copy-Item $exe.FullName cikti/Monke-Kurulum.exe
          Copy-Item "$($exe.FullName).sig" cikti/Monke-Kurulum.exe.sig
          Copy-Item $exe.FullName cikti/Ses-Kurulum.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: cikti/

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Derle ve imzala
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles app
      - name: Sabit isim
        run: |
          mkdir cikti
          cp src-tauri/target/release/bundle/macos/Monke.app.tar.gz cikti/Monke-mac.app.tar.gz
          cp src-tauri/target/release/bundle/macos/Monke.app.tar.gz.sig cikti/Monke-mac.app.tar.gz.sig
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: cikti/

  yayinla:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dosyalar
          merge-multiple: true
      - name: latest.json oluştur
        env:
          ETIKET: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          etiket = os.environ['ETIKET']
          surum = etiket.lstrip('v')
          ayar = json.load(open('src-tauri/tauri.conf.json'))
          # Etiket ile uygulamanın içindeki sürüm aynı olmalı; değilse uygulama
          # kendini sonsuza kadar "güncel değil" sanar.
          if ayar['version'] != surum:
              raise SystemExit(f"Etiket {etiket} ama tauri.conf.json sürümü {ayar['version']}")
          taban = f"https://github.com/yigitfire/sesapp/releases/download/{etiket}"
          imza = lambda f: open(f'dosyalar/{f}.sig').read().strip()
          json.dump({
              'version': surum,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'windows-x86_64': {'url': f'{taban}/Monke-Kurulum.exe', 'signature': imza('Monke-Kurulum.exe')},
                  'darwin-aarch64': {'url': f'{taban}/Monke-mac.app.tar.gz', 'signature': imza('Monke-mac.app.tar.gz')},
              },
          }, open('dosyalar/latest.json', 'w'), indent=2)
          EOF
          cat dosyalar/latest.json
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dosyalar/* \
            --title "Monke ${{ github.ref_name }}" \
            --notes "Windows ilk kurulum: Monke-Kurulum.exe. Kurulu uygulamalar kendini otomatik günceller."
